<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CreditBar</title>
  <link rel="stylesheet" href="style.css">
  <script src="aquarium.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <!-- One row per configured provider; the selected one expands into its card. -->
    <section class="card overview" id="overview"></section>

    <!-- Providers without a key. -->
    <section class="add" id="add-providers"></section>

    <!-- The tray menu's preferences, which the panel also needs because the GNOME Shell
         extension hides the tray icon, plus the panel's own. -->
    <section class="settings" id="settings" hidden>
      <label><input type="checkbox" id="setting-pricing"> <span data-i18n="tray.deepseekPricing"></span></label>
      <label><input type="checkbox" id="setting-countdown"> <span data-i18n="tray.countdown"></span></label>
      <label><input type="checkbox" id="setting-aquarium"> <span data-i18n="settings.animateAquarium"></span></label>
      <label><input type="checkbox" id="setting-login"> <span data-i18n="tray.autostart"></span></label>
    </section>

    <footer>
      <span class="brand">CreditBar</span>
      <span class="spacer"></span>
      <button id="settings-toggle" class="link" data-i18n="settings.title" aria-controls="settings" aria-expanded="false"></button>
      <button id="quit" class="link" data-i18n="panel.quit"></button>
    </footer>
  </main>

  <!-- DeepSeek's time-of-day pricing waits here and moves into the DeepSeek card when it
       opens; moving (not rebuilding) keeps the calendar's tab and month. -->
  <div id="parking" hidden>
    <section class="pricing" id="pricing">
      <div class="label" data-i18n="panel.deepseekPricing"></div>
      <canvas class="aquarium" id="aquarium" aria-hidden="true"></canvas>
      <div class="hero">
        <div class="hero-text">
          <h2 id="period">…</h2>
          <p id="price" class="muted small"></p>
        </div>
        <span class="badge" id="multiplier"></span>
      </div>

      <div class="block">
        <div class="label" data-i18n="panel.nextSwitch"></div>
        <div class="countdown" id="countdown">--:--:--</div>
        <div id="next" class="muted"></div>
        <div class="progress"><div id="progress"></div></div>
        <p id="day" class="muted small"></p>
      </div>

      <div class="block">
        <div class="tabs">
          <div class="segmented" role="tablist">
            <button role="tab" data-view="month" aria-selected="true" data-i18n="calendar.month"></button>
            <button role="tab" data-view="week" aria-selected="false" data-i18n="calendar.week"></button>
          </div>
          <button id="cal-prev" class="nav" data-i18n-label="calendar.previous">‹</button>
          <span id="cal-title" class="cal-title"></span>
          <button id="cal-next" class="nav" data-i18n-label="calendar.next">›</button>
        </div>
        <div id="calendar"></div>
        <div class="legend muted small">
          <span><i class="swatch peak"></i><span data-i18n="legend.peak"></span></span>
          <span><i class="swatch off"></i><span id="legend-off"></span></span>
          <span id="legend-holiday"><i class="dot"></i><span data-i18n="legend.holiday"></span></span>
        </div>
        <p class="muted small" data-i18n="panel.beijingNote"></p>
      </div>
    </section>
  </div>
</body>
</html>
