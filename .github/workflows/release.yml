name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (patch, minor, major, beta, or an exact version such as 1.2.3 or 1.3.0-beta.1). Releases and betas run from main.
        required: true
        type: string
        default: patch
      preview_branch:
        description: Allow a beta from a branch other than main, to preview that branch on its own.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 22.19.0

jobs:
  # Resolves the next version on top of the chosen branch. The quality gates and packaging both
  # start from it and run in parallel. Nothing is committed or tagged until both succeed, so a
  # failed run leaves the repository untouched.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous: ${{ steps.bump.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: bump
        name: Resolve release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: |
          TAGS="$(git ls-remote --tags origin)"
          CURRENT="$(node scripts/release-version.mjs current)"
          if [[ "$REQUESTED_VERSION" == beta ]]; then
            REQUESTED_VERSION="$(node scripts/release-version.mjs next-beta "$CURRENT" <<<"$TAGS")"
          fi
          VERSION="$(node scripts/release-version.mjs resolve "$CURRENT" "$REQUESTED_VERSION")"
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            if [[ "$VERSION" != *-* ]]; then
              echo "::error::Only betas are released from $GITHUB_REF_NAME. Release $VERSION from main."
              exit 1
            fi
            # A beta from main carries every fix merged so far; one from a branch carries only
            # that branch.
            if [[ "$PREVIEW_BRANCH" != true ]]; then
              echo "::error::Betas run from main. To preview $GITHUB_REF_NAME on its own, run again with preview_branch checked."
              exit 1
            fi
          fi
          # Fails unless the version sorts above every published one, and names the tag the
          # release notes start from.
          PREVIOUS="$(node scripts/release-version.mjs check "$VERSION" <<<"$TAGS")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $GITHUB_REF_NAME at $GITHUB_SHA, with notes since ${PREVIOUS:-the first commit}."

  # Runs every quality gate against the bumped tree.
  verify:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/release-version.mjs set "${{ needs.version.outputs.version }}"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libdbus-1-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  package:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            name: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles dmg
            artifacts: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # The oldest supported Ubuntu, so the AppImage also runs on older glibc.
          - os: ubuntu-22.04
            name: linux
            targets: ''
            tauri-args: --bundles deb,appimage
            artifacts: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/release-version.mjs set "${{ needs.version.outputs.version }}"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libdbus-1-dev build-essential file patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.name }}
      - name: Build and package
        working-directory: crates/app
        # Unsigned: there is no Apple Developer ID, so macOS builds are ad-hoc signed.
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.tauri-args }}
      - uses: actions/upload-artifact@v7
        with:
          name: creditbar-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  # Commits the version bump, tags it, and uploads the release as a draft only after every gate
  # and both packaging jobs have passed. A release moves main with it; a beta's commit is kept by
  # its tag alone, so no branch takes its version.
  release:
    needs: [version, verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pushes with RELEASE_DEPLOY_KEY when set, so the version commit can reach main once main
      # only takes pull requests and the deploy key is the ruleset's bypass actor. Without the
      # secret, it pushes with the workflow token.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Commit and tag the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/release-version.mjs set "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES=(crates/app/tauri.conf.json Cargo.toml Cargo.lock)
          if ! git diff --quiet -- "${FILES[@]}"; then
            git add "${FILES[@]}"
            git commit -m "chore(release): prepare v$VERSION"
          fi
          git tag "v$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            git push origin "refs/tags/v$VERSION"
          else
            # Atomic, so main and the tag move together or not at all. A push to main during the
            # run makes this fail rather than overwrite it.
            git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # The Linux artifact keeps Tauri's deb/ and appimage/ folders; the release takes files.
      - name: Collect the installers
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec mv -t dist {} +
          ls -l dist
      - name: Generate checksums
        run: node scripts/checksums.mjs dist
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          # Betas (1.2.0-beta.1) must not become the latest release.
          FLAGS=(--draft --generate-notes)
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          if [[ -n "$PREVIOUS" ]]; then FLAGS+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" --verify-tag --title "CreditBar $TAG" "${FLAGS[@]}"
          gh release upload "$TAG" --clobber dist/*

  # Publishes the draft once it holds every artifact and the checksums.
  publish-release:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          FLAGS=(--draft=false)
          if [[ "$TAG" != *-* ]]; then FLAGS+=(--latest); fi
          gh release edit "$TAG" "${FLAGS[@]}"
