name: Release

# Push a tag matching the app version (e.g. v0.1.0 for "version": "0.1.0" in
# crates/app/tauri.conf.json). The installers are attached to a draft release to review and
# publish by hand. Builds are unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: linux
            # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
            runner: ubuntu-22.04
            targets: ''
            args: --bundles deb,appimage
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import json; print(json.load(open('crates/app/tauri.conf.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app version $version"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libdbus-1-dev build-essential file patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Build installers
        working-directory: crates/app
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: creditbar-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "CreditBar $GITHUB_REF_NAME" \
            --generate-notes
